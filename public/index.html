<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Impollster</title>
<link rel="stylesheet" href="/common.css">
<style>
body{display:flex;justify-content:center;align-items:flex-start;padding:clamp(24px,8vh,80px) 16px}
.wrap{max-width:460px;width:100%;display:flex;flex-direction:column;gap:14px}
.landcard{background:#004a5a;border-radius:34px;padding:30px 28px 32px;display:flex;flex-direction:column;gap:20px;box-shadow:0 6px 14px rgba(0,0,0,.3)}
h1{color:#fff;font-size:clamp(2.2rem,9vw,3rem);text-align:center;line-height:1.05}
.landcard h2{font-size:1.5rem;color:#fff;text-align:center}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:480px){.choices{grid-template-columns:1fr}.choices .jn{order:-1}}
.choices .btn{min-height:84px;font-size:1.6rem;font-weight:800;border-radius:999px;display:flex;align-items:center;justify-content:center}
input{font:inherit;padding:14px;border-radius:10px;width:100%;font-size:1.1rem}
input.code{text-transform:uppercase;letter-spacing:.2em}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.row .btn{border-radius:999px;font-weight:800;padding:10px 26px}
.linkbtn{font:inherit;background:none;border:0;color:#a8cfd8;text-decoration:underline;cursor:pointer;padding:4px;align-self:flex-end}
#msg{margin:0}
</style>
</head>
<body class="theme">
<div class="wrap">
  <div id="msg" hidden></div>
  <div class="landcard" id="view"></div>
</div>
<script src="/common.js"></script>
<script>
(function(){
  var view=$('view');
  function title(){return h('h1',{text:'Impollster'});}
  function home(){
    view.replaceChildren(title(),h('div',{class:'choices'},
      h('button',{class:'btn primary hs',type:'button',onclick:hosting,text:'Host'}),
      h('button',{class:'btn jn',type:'button',onclick:joining,text:'Join'})));
  }
  function backBtn(to){return h('button',{class:'btn',type:'button',onclick:to||home,text:'Back'});}
  function hosting(){
    var name=h('input',{type:'text',maxlength:'60',placeholder:'Room name (optional)','aria-label':'Room name'});
    var form=h('form',{style:'display:contents',onsubmit:function(e){e.preventDefault();api('POST','/api/rooms',{name:escHtml(name.value.trim())}).then(function(r){location.href='/host#'+r.hostCode;},function(x){setMsg(x.message,true);});}},
      h('h2',{text:'Host'}),name,h('div',{class:'row'},h('button',{class:'btn primary',type:'submit',text:'Start a New Room'}),backBtn()),
      h('button',{class:'linkbtn',type:'button',onclick:returning,text:'Returning?'}));
    view.replaceChildren(title(),form);name.focus();
  }
  function returning(){
    var code=h('input',{class:'code',maxlength:'6',placeholder:'6-character host code','aria-label':'Host code',autocomplete:'off'});
    var last=store('btp_host');if(last)code.value=last;
    var f2=h('form',{style:'display:contents',onsubmit:function(e){e.preventDefault();var c=code.value.trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(c))return setMsg('Host codes are 6 characters.',true);location.href='/host#'+c;}},
      h('h2',{text:'Host'}),code,h('div',{class:'row'},h('button',{class:'btn primary',type:'submit',text:'Open'}),backBtn(hosting)));
    view.replaceChildren(title(),f2);code.focus();
  }
  function joining(){
    var code=h('input',{class:'code',maxlength:'4',placeholder:'4-letter room code','aria-label':'Room code',autocomplete:'off'});
    var form=h('form',{style:'display:contents',onsubmit:function(e){e.preventDefault();var c=code.value.trim().toUpperCase();if(!/^[A-Z0-9]{4}$/.test(c))return setMsg('Room codes are 4 characters.',true);location.href='/play#'+c;}},
      h('h2',{text:'Join'}),code,h('div',{class:'row'},h('button',{class:'btn primary',type:'submit',text:'Join'}),backBtn()));
    view.replaceChildren(title(),form);code.focus();
  }
  home();
})();
</script>
</body>
</html>
