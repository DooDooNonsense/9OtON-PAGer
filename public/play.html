<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Impollster - Play</title>
<link rel="stylesheet" href="/common.css">
<style>
body{padding:0;min-height:100vh}
.topbar{background:#00203a;padding:10px 16px;box-shadow:0 2px 6px rgba(0,0,0,.35);position:sticky;top:0;z-index:5}
.topbar .phead{max-width:560px;margin:0 auto}
.pwrap{max-width:560px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:14px}
.phead{display:flex;align-items:center;gap:8px;justify-content:space-between}
.pname{font-weight:700;font-size:1.35rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pname small{font-weight:600;color:var(--muted);margin-left:6px}
.phead .acts{display:flex;gap:6px;flex:none}
.pcard{background:#004a5a;border-radius:34px;box-shadow:0 6px 14px rgba(0,0,0,.3);padding:22px;display:flex;flex-direction:column;gap:14px;min-height:calc(100svh - 150px);justify-content:flex-start}
.pcard>:first-child{margin-top:0}
.pcard.center{align-items:center;text-align:center}
.pcard .vote-name{font-size:clamp(1.6rem,7vw,2.4rem)}
.pcard .tier-btn{min-height:60px;font-size:1.6rem;border-radius:16px;box-shadow:0 3px 6px rgba(0,0,0,.3)}
.pcard .vote-img{border-radius:50%;aspect-ratio:1;object-fit:cover;width:min(60vw,22svh);border:5px solid #00c0ff;align-self:center}
.pcard .vote-name{text-align:center}
.pcard .tier-grid{grid-template-columns:repeat(4,1fr)}
.pcard .bubble{max-height:20svh;overflow:auto}
.pcard .result-tier{align-self:center}
.status{font-size:1.15rem;font-weight:700}
.dots span{animation:blink 1.2s infinite both}.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.15}40%{opacity:1}}
.hint{color:var(--muted);font-size:.92rem}
.tstage .q-text.big{font-size:1.3rem}
/* history */
.hist{display:flex;flex-direction:column;gap:12px;padding-top:6px}
.hist-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hist-head h2{font-size:1.4rem;color:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{font:inherit;font-weight:600;border:0;background:#004a5a;color:#fff;padding:8px 12px;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:#00203a;box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
.hrow{display:flex;align-items:center;gap:10px;background:#004a5a;border-radius:999px;padding:6px 8px 6px 8px;box-shadow:0 3px 6px rgba(0,0,0,.25)}
.hrow img{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none}
.hrow .hn{flex:1;min-width:0;overflow-wrap:anywhere}
.hrow .tag{flex:none;min-width:40px;text-align:center;font-weight:800;padding:6px 12px;border-radius:999px;background:var(--tc);color:var(--on-tier)}
.hrow .tag.dim{background:var(--panel-2);color:var(--muted)}
.tdots{display:inline-flex;gap:4px;flex:none}
.tdots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.tdots i.right{background:#2f9e44}.tdots i.wrong{background:var(--danger)}
.hbtn{font:inherit;border:0;background:var(--panel-2);color:var(--fg);border-radius:8px;padding:4px 10px;cursor:pointer;min-height:32px;flex:none}
.frow{display:grid;grid-template-columns:56px 1fr;border-radius:26px;overflow:hidden;background:#004a5a;box-shadow:0 3px 6px rgba(0,0,0,.25)}
.frow .fl{display:flex;align-items:center;justify-content:center;font-weight:800;background:var(--tc);color:var(--on-tier);padding:4px;text-align:center;overflow-wrap:anywhere}
.frow .fi{display:flex;flex-wrap:wrap;gap:6px;padding:8px;min-height:48px;align-items:center}
.frow .chip{background:#00c0ff;color:#000;border-radius:999px;font-weight:700}
.gate{display:flex;flex-direction:column;gap:14px;max-width:360px;width:100%}
.gate input{font:inherit;font-size:1.2rem;padding:12px;border-radius:10px;width:100%}
.ptitle{font-weight:700;font-size:1.3rem;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.psub{font-size:.9rem;color:var(--muted);margin-top:2px}
.pts{position:relative}
.plus{position:absolute;left:100%;margin-left:6px;top:-2px;color:#6ee08a;font-weight:800;font-size:1.05rem;animation:plus 2.2s ease both;white-space:nowrap}
@keyframes plus{0%{opacity:0;transform:translateY(8px)}18%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.pname{min-width:0}
.tile-wrap{display:flex;justify-content:center;border-radius:50%;align-self:center}
.tile{position:relative;width:min(44vw,170px);aspect-ratio:1;border-radius:50%;background:#00c0ff;color:#000;display:flex;align-items:center;justify-content:center;font-weight:800;text-align:center;overflow:hidden;padding:12%;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile img+.tt{text-shadow:0 0 3px #fff,0 0 6px #fff,0 0 12px #fff,0 0 20px rgba(255,255,255,.85)}
.tile .tt{position:relative;line-height:1.05;overflow-wrap:anywhere}
.tile-wrap.over{box-shadow:0 0 0 3px #ffd23f}.tile-wrap.over.big{box-shadow:none;border-radius:0}
.lobby-title{text-align:center;font-size:1.8rem}
.tier-stack{display:flex;flex-direction:column;gap:10px}
.pcard .tier-stack .tier-btn{width:100%;min-height:56px;font-size:1.5rem}
.has-pick .tier-btn[aria-pressed="false"]{opacity:.55}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;margin-left:8px;border-radius:50%;border:1.5px solid currentColor;background:transparent;color:inherit;font:italic 700 .8rem Georgia,serif;cursor:pointer;vertical-align:middle;padding:0;opacity:.85}
.ibtn:hover{opacity:1;background:rgba(255,255,255,.15)}
.frow .chip.over{box-shadow:0 0 0 2px #ffd23f}
.frow .chip .ibtn{width:18px;height:18px;font-size:.7rem;margin-left:4px;color:#000}
.pcard .desc{width:100%;max-height:24svh}
.pcard .result-tier{align-self:center}
.pcard .infobox{width:100%}
.pcard .tstage .opts{display:flex;flex-direction:column;gap:10px}

.soon{font-size:clamp(1.5rem,6vw,2.2rem);color:#7fb0b8;text-align:center;line-height:1.1}
.lr-box{width:100%;background:#10343b;border-radius:28px;padding:10px 10px;display:flex;flex-direction:column;gap:10px;text-align:left}
.lr-row{display:grid;grid-template-columns:minmax(0,1fr) 52px 54px;align-items:center;gap:8px}
.ipill{display:inline-flex;align-items:center;justify-self:start;max-width:100%;min-width:0;background:#4fb0f4;color:#000;border-radius:999px;padding:5px 7px 5px 14px;font-weight:700;font-size:1rem}
.ipn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;max-width:10em}
.tcap{display:inline-flex;flex:none;width:46px;height:20px;border-radius:999px;overflow:hidden;margin-left:8px}
.tcap i{flex:1;background:#7f7f7f}.tcap i.right{background:#5a9b5a}.tcap i.wrong{background:#8c2f39}
.ipill .ibtn{width:22px;height:22px;margin-left:8px;border:0;background:#2a7fc0;color:#cfe9ff;flex:none}
.lr-tier{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem;line-height:1;padding:7px 4px;border-radius:12px;background:var(--tc);color:var(--on-tier)}
.lr-tier.over{box-shadow:0 0 0 2px #ffd23f}
.lr-v{color:#7fb0b8;font-weight:800;font-size:.95rem;white-space:nowrap}
.hold-msg{font-size:1.2rem;line-height:1.35;font-weight:600;max-width:34ch}
.hold-msg b{font-size:1.3em}
.pcard .actions.yn{justify-content:center}
.tdots i.miss{background:#7f7f7f}
/* round 6 */
button.ipill{font:inherit;font-weight:700;font-size:1rem;border:0;cursor:pointer;text-align:left;color:#000}
.ipill.tap:hover{filter:brightness(1.1)}.ipill.tap:active{transform:translateY(1px)}
.ipimg{width:24px;height:24px;border-radius:50%;object-fit:cover;margin-left:-8px;margin-right:8px;flex:none}
.lr-row.hist{grid-template-columns:minmax(0,1fr) 52px}
.tcap i.miss{background:#7f7f7f}
.ell-slot{min-height:56px;display:flex;align-items:center;justify-content:center;font-size:2.4rem;font-weight:800;line-height:1}
.pcard.center .ell-slot{width:100%}
.plus.yel{color:#ffd23f}
.chip.tapchip{cursor:pointer}.chip.tb{box-shadow:0 0 0 2px #3fbf6b}.frow .chip.over.tb{box-shadow:0 0 0 2px #ffd23f}
.rv-pop .tc-body{max-height:calc(100svh - 160px);overflow-y:auto}
.rv-q{background:#10343b;border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.rv-n{font-size:.85rem;font-weight:800;color:#7fb0b8;letter-spacing:.04em}
.rv-text{font-weight:800;font-size:1.1rem}
.rv-ans{border-radius:999px;padding:8px 16px;font-weight:600;color:#fff;overflow-wrap:anywhere}
.rv-ans.right{background:#1fae5a}.rv-ans.wrong{background:#d9364a}
.rv-miss{background:#6f7a7c;color:#fff;border-radius:999px;padding:10px 18px;font-weight:700;text-align:center}
.pb{display:flex;flex-direction:column;gap:8px}
.pb-row{display:grid;grid-template-columns:48px 1fr 74px;gap:10px;align-items:center}
.pb-l{border-radius:10px;padding:4px;text-align:center;font-weight:800;background:var(--tc);color:var(--on-tier);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb-t{height:20px;background:#00323f;border-radius:999px;overflow:hidden}.pb-f{height:100%;border-radius:999px}
.pb-n{font-size:.85rem;color:var(--muted);text-align:right}
.winline{margin-bottom:4px}
</style>
</head>
<body class="theme">
<header class="topbar"><div class="phead" id="phead"></div></header>
<div class="pwrap">
  <div id="msg" hidden></div>
  <section id="main" aria-live="polite"></section>
  <section class="hist" id="hist" aria-label="My history"></section>
</div>
<div class="overlay" id="dialog" hidden></div>
<script src="/common.js"></script>
<script src="/play.js"></script>
</body>
</html>
