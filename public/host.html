<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Impollster - Host</title>
<link rel="stylesheet" href="/common.css">
<style>
body{padding:0;min-height:100vh;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 28px;height:clamp(56px,9.6vh,106px);background:#00203a;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.topbar h1{font-size:clamp(1.25rem,min(4.4vh,5.6vw),3.3rem);font-weight:700;color:#fff;letter-spacing:.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:520px){.topbar{padding:0 16px;gap:10px}}
.tb-right{display:flex;gap:10px;align-items:center}
.tb-btn{border:0;background:transparent;color:#8e9399;cursor:pointer;padding:6px;border-radius:10px;display:flex}
.tb-btn:hover{color:#fff}.tb-btn svg{width:clamp(30px,5.6vh,60px);height:clamp(30px,5.6vh,60px)}
#msg{position:fixed;left:50%;transform:translateX(-50%);top:90px;z-index:30;max-width:90vw;background:var(--panel);box-shadow:0 6px 20px rgba(0,0,0,.4)}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;padding:clamp(10px,2.4vh,30px) clamp(16px,2.6vw,50px)}
.foot{flex:none;padding:0 28px clamp(8px,1.8vh,20px);color:#fff;font-weight:700;font-size:clamp(1rem,2.8vh,1.8rem);display:flex;gap:28px;flex-wrap:wrap;align-items:baseline}
.foot .sub{font-weight:500;opacity:.85}
/* board + queue */
.stagegrid{flex:1;min-height:0;display:grid;grid-template-columns:clamp(190px,17vw,300px) 1fr;gap:clamp(16px,2.4vw,44px);align-items:stretch}
.qside{display:flex;flex-direction:column;gap:14px;align-items:stretch;justify-content:center;min-height:0}
.qside .desc{font-size:.85rem;max-height:30vh}
.qcard{position:relative;background:#004a5a;border-radius:34px;padding:16px;display:flex;flex-direction:column;gap:14px;align-items:stretch;width:100%;box-shadow:0 6px 14px rgba(0,0,0,.3)}
.qcircle{position:relative;aspect-ratio:1;border-radius:50%;background:#00c0ff;color:#000;display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;padding:12%;text-align:center}
.qcircle img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.qcircle .qt{font-size:clamp(1.3rem,3.2vh,2.6rem);line-height:1.05;overflow-wrap:anywhere;position:relative}
.qgo{white-space:nowrap;overflow:hidden;font-size:clamp(1.1rem,2.6vh,1.7rem)!important;min-height:0!important;padding:10px 12px!important;border-radius:999px!important;font-weight:800}
.qlink{font:inherit;background:none;border:0;color:var(--muted);cursor:pointer;text-decoration:underline;padding:2px}
.qempty{text-align:center;font-weight:700;font-size:1.3rem;padding:20px 4px}
.stage .rb{gap:clamp(8px,1.8vh,22px);height:100%}
.stage .rb-row{flex:1;min-height:0;grid-template-columns:clamp(70px,8vw,130px) 1fr;border-radius:clamp(20px,3.4vh,36px);background:#004a5a;box-shadow:0 4px 8px rgba(0,0,0,.28)}
.stage .rb-label{font-size:clamp(1.6rem,6vh,3.6rem);color:var(--on-tier)}
.stage .rb-label.long{font-size:clamp(.9rem,2.4vh,1.6rem)}
.stage .rchip.land{animation:land .9s cubic-bezier(.2,1.7,.4,1)}
@keyframes land{0%{transform:scale(0) rotate(-90deg)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
/* takeover cards */
.card{background:#004a5a;border-radius:34px;padding:clamp(18px,3.4vh,44px);display:flex;flex-direction:column;gap:clamp(12px,2.4vh,26px);align-items:stretch;flex:1;min-height:0;justify-content:safe center;box-shadow:0 6px 14px rgba(0,0,0,.3);overflow:auto}
.card>.label{text-align:center;font-size:1rem}
.hero{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.hero-img{max-height:clamp(110px,28vh,420px);max-width:100%;border-radius:50%;aspect-ratio:1;object-fit:cover;border:6px solid #00c0ff}
.hero-name{font-weight:800;font-size:clamp(2.4rem,8vh,5.6rem);line-height:1.05;max-width:100%;min-width:0}
.polling{font-size:clamp(1.8rem,5vh,3rem);font-weight:700;text-align:center;color:#00c2ff}
.dd{animation:blink 1.2s infinite both}.dd:nth-child(3){animation-delay:.2s}.dd:nth-child(4){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.15}40%{opacity:1}}
.card>.muted{text-align:center}
.muted.big{font-size:1.4rem}
.actions.center{justify-content:center}
.btn.big-btn{min-height:60px;padding:12px 30px;font-size:1.3rem;border-radius:999px;font-weight:800}
.ask.big{font-size:1.6rem;font-weight:800}
.res-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:32px;align-items:center}
@media (max-width:800px){.res-grid{grid-template-columns:1fr}}
.res-bars{display:flex;flex-direction:column;gap:clamp(6px,1.4vh,14px)}
.res-row{display:grid;grid-template-columns:clamp(64px,7vw,110px) 1fr 120px;gap:14px;align-items:center}
.res-label{border-radius:14px;padding:clamp(4px,1vh,10px) 6px;text-align:center;font-weight:800;font-size:clamp(1.1rem,3vh,2rem);background:var(--tc);color:var(--on-tier);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-track{height:clamp(24px,4.4vh,44px);background:#00323f;border-radius:999px;overflow:hidden}
.res-fill{height:100%;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1);border-radius:999px}
.res-fill.go{width:var(--w)}
.res-n{font-size:1.15rem;color:var(--muted)}
@media (max-width:480px){.res-row{grid-template-columns:48px 1fr 78px;gap:8px}.res-n{font-size:.95rem}}
.res-row.win .res-label{outline:4px solid #fff;outline-offset:2px}
.res-row.win .res-n{color:#fff;font-weight:800}
.res-banner{text-align:center;font-size:1.8rem;font-weight:800;display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:12px}
.res-banner.pop{animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
.res-win{background:var(--tc);color:var(--on-tier);padding:6px 24px;border-radius:999px;font-size:2.4rem}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.card .tstage{width:100%;max-width:1100px;margin:0 auto}
.tstage.host .q-text.big{font-size:clamp(1.8rem,5vh,3.2rem)}
.small{font-size:.9rem}
.menu-list{display:flex;flex-direction:column;gap:8px}
.menu-item{text-align:left}
.stack.tight{gap:14px}
/* menu (gear) */
.modal.gm{max-width:1060px;width:100%;padding:0;gap:0;background:#004a5a;border:0;border-radius:36px;overflow:hidden;height:min(720px,calc(100vh - 32px));box-shadow:0 18px 50px rgba(0,0,0,.55)}
.gm-bar{display:flex;align-items:flex-end;background:#00323f;padding:14px 16px 0;gap:4px;flex:none}
.gm-nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.gm-tab{font:inherit;font-weight:700;font-size:clamp(1.05rem,2.6vh,1.7rem);border:0;background:transparent;color:#fff;padding:12px 24px;border-radius:26px 26px 0 0;cursor:pointer}
.gm-tab:hover{background:rgba(255,255,255,.07)}
.gm-tab.on{background:#004a5a}
.gm-x{align-self:center;margin:0 8px 8px 0}
.gm-pane{flex:1;min-height:0;overflow-y:auto;padding:22px 26px 28px;display:flex;flex-direction:column;gap:20px}
.gs{display:flex;flex-direction:column;gap:12px}
.gs h3{font-size:1.5rem;font-weight:700}
.gs-desc{margin:0;color:var(--muted);font-size:.95rem}
.grow-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-top:1px solid rgba(255,255,255,.12)}
.gs>.grow-row:first-of-type,.gs>.gs-desc+.grow-row:first-of-type{border-top:0}
.gr-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.gr-text b{font-size:1.15rem}
.gr-text span{color:var(--muted);font-size:.9rem}
.gr-ctl{flex:none;max-width:58%}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.switch.bare{border-top:0;padding-top:0}
.lblrow{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start}
.lblrow>.lbl{font-size:1.6rem;font-weight:700;line-height:1.05;padding-top:6px}
.lblrow>.lbl small{display:block;font-size:.85rem;font-weight:400;color:#fff;line-height:1.1;margin-top:4px;max-width:150px}
.items-list,.tier-ed{display:flex;flex-direction:column;gap:8px}
.item-row,.tier-ed-row{display:flex;align-items:center;gap:12px;padding:6px 8px;background:#85a8ae;color:#000;border-radius:6px}
.item-thumb{width:48px;height:48px;border-radius:50%;object-fit:cover;flex:none;background:#b3f0ff}
.item-thumb.blank,.item-thumb.txt{display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:800;color:#000;overflow:hidden;text-align:center;line-height:1}
.item-main{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.item-name{font-weight:700;font-size:1.5rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-meta{display:flex;gap:6px;flex-wrap:wrap}
.item-acts{display:flex;gap:6px;flex:none;align-items:center}
.gm .item-row .btn.icon,.gm .tier-ed-row .btn.icon,.gm .item-row .btn.small{--bc:#17798b;--be:#0f5a69;color:#fff;border-radius:6px;min-height:36px;width:38px;padding:0}
.gm .item-row .btn.small.danger,.gm .item-row .btn.icon.danger{color:#fff}
.gm .item-row .btn.small:not(.icon){width:auto;padding:0 12px}
.kind{border-radius:999px;padding:2px 14px;font-weight:700;font-size:1.05rem;background:#0a9a0a;color:#fff;border:2px solid #0a6a0a;white-space:nowrap}
.kind.text{background:#2a6fdb;border-color:#1a4aa0}.kind.inc{background:#a07020;border-color:#704800}
.stat{font-size:.8rem;color:#123;background:rgba(255,255,255,.55);border-radius:999px;padding:1px 9px;white-space:nowrap}
.tier-ed-row .grow{flex:1;min-width:0}
.tier-ed-row .rt{background:transparent;border:0;box-shadow:none}
.tier-ed-row .rt-body{color:#000;font-size:1.6rem;font-weight:700;min-height:0;padding:2px 4px;background:transparent}
.tier-ed-row .rt-bar{display:none}
.tier-ed-row .rt:focus-within .rt-bar{display:flex}
.colorpick{-webkit-appearance:none;appearance:none;width:42px;height:42px;border-radius:50%;border:2px solid #000;padding:0;background:none;cursor:pointer;flex:none;overflow:hidden}
.colorpick::-webkit-color-swatch-wrapper{padding:0}.colorpick::-webkit-color-swatch{border:0;border-radius:50%}.colorpick::-moz-color-swatch{border:0;border-radius:50%}
.gm .gs input[type=text],.gm .gs input[type=number]{padding:10px 12px;border-radius:6px;font:inherit;font-size:1.05rem;min-width:0}
@media (max-width:760px){.stage .rb{height:auto}.stage .rb-row{flex:none;height:88px;grid-template-columns:64px 1fr}.stage .rb-label{font-size:1.6rem}.stagegrid{grid-template-columns:1fr;overflow:visible}.qside{order:2}.modal.gm{height:calc(100vh - 24px);border-radius:22px}.gm-tab{padding:10px 12px}body{overflow:auto;height:auto}}
.qcount{text-align:center;font-weight:700;font-size:clamp(.9rem,2vh,1.2rem);color:#fff}
.qskip{position:absolute;top:10px;right:16px;font:inherit;font-size:.85rem;background:none;border:0;color:#fff;opacity:.4;cursor:pointer;padding:2px 4px}
.qskip:hover{opacity:.9;text-decoration:underline}
.qempty{padding:26px 4px 10px}
.rb-row{container-type:size}
.rwrap{position:relative;min-width:0;display:flex}
.stage .rrow{flex:1;min-width:0;min-height:0;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;padding:0 14px;gap:14px;align-items:center;align-content:center;touch-action:pan-x}
.stage .rrow::-webkit-scrollbar{display:none}
.stage .rchip{--cs:clamp(46px,9vh,100px);width:var(--cs);height:var(--cs);flex:none;box-shadow:0 2px 4px rgba(0,0,0,.25);overflow:visible;border-radius:50%;touch-action:pan-x}
@container (min-height:1px){.stage .rchip{--cs:clamp(40px,calc(100cqh - 20px),110px)}}
.stage .rchip img{border-radius:50%}
.stage .rtx{border-radius:50%}
.stage .rchip.over{box-shadow:0 0 0 2px #ffd23f,0 2px 4px rgba(0,0,0,.25)}
.stage .rchip.unlocked{outline:4px solid #fff;outline-offset:2px;touch-action:none;z-index:2}
.redge{position:absolute;top:0;bottom:0;width:clamp(60px,6vw,110px);display:none;align-items:center;cursor:pointer;z-index:4}
.redge.r{right:0;justify-content:flex-end;padding-right:16px;background:linear-gradient(90deg,rgba(0,98,123,0),#00627b 65%)}
.redge.l{left:0;justify-content:flex-start;padding-left:16px;background:linear-gradient(270deg,rgba(0,98,123,0),#00627b 65%)}
.redge span{color:#fff;font-size:clamp(1.6rem,4.5vh,3rem);line-height:1;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.actions.col{flex-direction:column;align-items:center;gap:10px}
.lockmsg{color:var(--muted);font-weight:600}.lockmsg.all{color:#6ee08a}
.actions.yn{gap:16px}
.rm-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:700;font-size:1.15rem}
.res-win.sm{font-size:1.2rem;padding:2px 16px}
.menu-item{width:100%}
button.kind{font:inherit;cursor:pointer;font-weight:700;font-size:1.05rem}
button.kind:hover{filter:brightness(1.12);text-decoration:underline}
.gm textarea{width:100%;resize:none;font:inherit;padding:10px 12px;border-radius:6px;line-height:1.35}
.card .desc{max-width:900px;margin:0 auto;width:100%}
.rm.armed{overflow:hidden;white-space:nowrap;animation:rmgrow .2s ease-out}
@keyframes rmgrow{from{max-width:38px;opacity:.6}to{max-width:160px;opacity:1}}
.grow-row.off{opacity:.45}.grow-row.off .switch{pointer-events:none}
.rt-body.multi{min-height:96px;max-height:260px;overflow-y:auto;white-space:pre-wrap}
.rt-body ul{margin:.25em 0;padding-left:1.5em}.rt-bul{font-size:.85em;letter-spacing:-1px}
.qcircle img+.qt{color:#000;text-shadow:0 0 3px #fff,0 0 6px #fff,0 0 12px #fff,0 0 20px rgba(255,255,255,.85)}
.card>*{flex-shrink:0}.hero-img{flex:none}
@media (max-width:760px){
.gm-bar{padding:10px 10px 0}
.gm-nav{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:2px}
.gm-nav::-webkit-scrollbar{display:none}
.gm-tab{flex:none;white-space:nowrap;font-size:.88rem;padding:9px 9px}
.item-row{flex-wrap:wrap}
.item-main{flex-wrap:wrap;row-gap:4px;min-width:60%}
.item-name{max-width:calc(100% - 52px)}
.grow-row{flex-wrap:wrap;row-gap:8px}
.gr-text{flex:1 1 150px}
.grow-row .gr-ctl{width:auto;max-width:100%;flex:none;margin-left:auto}
.gr-ctl .inline{flex-wrap:nowrap}
.gr-ctl input[type=number]{width:70px!important}
}
</style>
</head>
<body class="theme">
<header class="topbar">
  <h1 id="room-title">Impollster</h1>
  <div class="tb-right">
    <button class="tb-btn" id="lb-btn" type="button" aria-label="Leaderboard" title="Leaderboard"></button>
    <button class="tb-btn" id="gear-btn" type="button" aria-label="Menu and settings" title="Menu and settings" aria-haspopup="dialog"></button>
  </div>
</header>
<div id="msg" hidden></div>
<section class="stage" id="stage" aria-live="polite"></section>
<footer class="foot" id="foot"></footer>
<div class="overlay" id="dialog" hidden></div>
<script src="/common.js"></script>
<script src="/host.js"></script>
<script>
document.getElementById('gear-btn').innerHTML=ICON_GEAR;
document.getElementById('lb-btn').innerHTML='<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M7 3h10v2h3v3a4 4 0 0 1-4 4h-.3A5 5 0 0 1 13 14.9V17h3v2H8v-2h3v-2.1A5 5 0 0 1 8.3 12H8a4 4 0 0 1-4-4V5h3V3Zm-1 4v1a2 2 0 0 0 1.2 1.8A5 5 0 0 1 7 8V7H6Zm12 0h-1v1a5 5 0 0 1-.2 1.8A2 2 0 0 0 18 8V7ZM6 20h12v2H6v-2Z"/></svg>';
</script>
</body>
</html>
